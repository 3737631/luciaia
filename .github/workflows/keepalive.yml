name: Keep Supabase active

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping voice function
        run: |
          # La petición llega a la función (actividad = no pausa) sin coste de IA
          curl -fsS -o /dev/null \
            -X POST "https://rebviqktyvzwwqqmvtsi.supabase.co/functions/v1/voice" \
            -H "Content-Type: application/json" \
            --data '{"action":"ping"}'
